<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floren VR</title>
  <meta name="description" content="Página de Floren VR — próximamente.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    .card {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 1.125rem;
      color: #94a3b8;
    }

    .dots::after {
      content: "";
      display: inline-block;
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%  { content: "..."; }
      100% { content: ""; }
    }

    @media (max-width: 480px) {
      h1 { font-size: 1.75rem; }
      p  { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🚧 Trabajando en ello</h1>
    <p>Mi portfolio está en construcción<span class="dots"></span></p>
  </main>
</body>
</html>
